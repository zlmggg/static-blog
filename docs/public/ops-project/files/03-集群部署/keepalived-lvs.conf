# ============================================================
# LVS-DR 四层负载 + keepalived 高可用（模板）
# 部署路径：/etc/keepalived/keepalived.conf
#
# 使用前替换三处：
#   <IFACE>     物理网卡名（ip -br link 里除 lo 外的那个，通常是 ens18）
#   <STATE>     lvs-01 = MASTER，lvs-02 = BACKUP
#   <PRIORITY>  lvs-01 = 100，lvs-02 = 90
#   <ROUTER_ID> LVS_01 / LVS_02
# ============================================================

global_defs {
    router_id <ROUTER_ID>
    enable_script_security
}

vrrp_instance VI_1 {
    state <STATE>
    interface <IFACE>
    virtual_router_id 51
    priority <PRIORITY>
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass lab2026
    }

    virtual_ipaddress {
        10.0.0.119/24 dev <IFACE>
    }
}

virtual_server 10.0.0.119 80 {
    delay_loop 6
    lb_algo wrr
    lb_kind DR
    persistence_timeout 0
    protocol TCP

    real_server 10.0.0.120 80 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            nb_get_retry 3
            delay_before_retry 3
            connect_port 80
        }
    }

    real_server 10.0.0.121 80 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            nb_get_retry 3
            delay_before_retry 3
            connect_port 80
        }
    }
}
