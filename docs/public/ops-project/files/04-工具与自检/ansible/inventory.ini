# ============================================================
# 在线教育平台实验集群 · Ansible Inventory（37 台）
# 控制端：bastion (10.0.0.100)，本文件放在 bastion 的 /etc/ansible/
# 全部使用私网地址，依赖管理通道已打通（见手册 5.5）
# ============================================================

[bastion]
bastion            ansible_host=10.0.0.100  ansible_role=primary

# ---- 运维审计入口（PAM），人的访问走这里，自动化走 bastion ----
[jumpserver]
jumpserver         ansible_host=10.0.0.103  ansible_role=pam

# ---- Ansible 三节点：主控=bastion，另两台为备控和执行节点 ----
[ansible_nodes]
ansible-02         ansible_host=10.0.0.101  ansible_role=standby
ansible-03         ansible_host=10.0.0.102  ansible_role=executor

[ansible:children]
bastion
ansible_nodes

[lvs]
lvs-01             ansible_host=10.0.0.110
lvs-02             ansible_host=10.0.0.111

[nginx]
nginx-01           ansible_host=10.0.0.120
nginx-02           ansible_host=10.0.0.121

# ---- 应用：蓝绿分组，部署脚本按组操作 ----
[app_blue]
app-blue-01        ansible_host=10.0.0.130
app-blue-02        ansible_host=10.0.0.131

[app_green]
app-green-01       ansible_host=10.0.0.132
app-green-02       ansible_host=10.0.0.133

[app:children]
app_blue
app_green

[mysql]
mysql-01           ansible_host=10.0.0.150  mysql_role=master
mysql-02           ansible_host=10.0.0.151  mysql_role=slave
mysql-03           ansible_host=10.0.0.152  mysql_role=slave

[redis]
redis-01           ansible_host=10.0.0.160  redis_role=master
redis-02           ansible_host=10.0.0.161  redis_role=replica
redis-03           ansible_host=10.0.0.162  redis_role=replica

[minio]
minio-01           ansible_host=10.0.0.170
minio-02           ansible_host=10.0.0.171
minio-03           ansible_host=10.0.0.172

[es]
es-01              ansible_host=10.0.0.180
es-02              ansible_host=10.0.0.181
es-03              ansible_host=10.0.0.182  es_logstash=true

[monitor]
prom-01            ansible_host=10.0.0.190
grafana-01         ansible_host=10.0.0.191

# ---- CI/CD：1 master + 2 agent ----
[cicd]
gitlab-01          ansible_host=10.0.0.200
jenkins-01         ansible_host=10.0.0.201  jenkins_role=master

[jenkins_agents]
jenkins-agent-01   ansible_host=10.0.0.202  jenkins_role=agent  jenkins_label=docker
jenkins-agent-02   ansible_host=10.0.0.203  jenkins_role=agent  jenkins_label=maven

[cicd:children]
jenkins_agents

[harbor]
harbor-01          ansible_host=10.0.0.210  harbor_role=primary
harbor-02          ansible_host=10.0.0.211  harbor_role=replica

[k8s_master]
k8s-m01            ansible_host=10.0.0.220
k8s-m02            ansible_host=10.0.0.221
k8s-m03            ansible_host=10.0.0.222

[k8s_worker]
k8s-w01            ansible_host=10.0.0.230
k8s-w02            ansible_host=10.0.0.231

[k8s:children]
k8s_master
k8s_worker

# ---- 逻辑分组：按层批量执行用 ----
[edge:children]
lvs
nginx

[data:children]
mysql
redis

[storage:children]
minio
es

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_become_timeout=30
