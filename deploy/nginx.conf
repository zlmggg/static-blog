# 静态站点 Nginx 配置（作为 conf.d/default.conf，http 上下文由镜像主配置提供）
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 不返回 Nginx 版本号
    server_tokens off;

    # 安全响应头基线
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS：强制浏览器走 HTTPS；本站经 CDN/SLB 终止 TLS，头部会透传回浏览器
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 健康检查端点：供 Docker HEALTHCHECK / 外部拨测（UptimeRobot、blackbox exporter）探测存活
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 路由回退：先找文件，再找 .html（VitePress 干净链接），最后回退首页
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
