services:
  sre-notes:
    build:
      # compose 文件在 deploy/ 下，构建上下文需要回到项目根目录
      context: ..
      dockerfile: deploy/Dockerfile
    image: sre-notes:latest
    container_name: sre-notes
    restart: unless-stopped
    ports:
      - "8080:80"
    # 存活探针：探测容器内 Nginx 的 /health 端点
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
#（注：内容由AI生成）
